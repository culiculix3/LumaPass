name: Quality & security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: API · tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Run API and pass-generation tests
        run: python -m pytest
      - name: Lint backend
        run: ruff check backend
      - name: Check formatting
        run: ruff format --check backend
      - name: Static security analysis
        run: bandit -q -r backend/app -c pyproject.toml
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  secrets:
    name: Repository · secret detection
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits and files for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    name: iOS · build and unit tests
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build for the iOS simulator
        run: |
          xcodebuild \
            -project LumaPass.xcodeproj \
            -scheme LumaPass \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run iOS core unit tests
        run: |
          xcodebuild \
            -project LumaPass.xcodeproj \
            -scheme LumaPass \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Check for leaked signing material
        run: |
          if find . -type f \( -name '*.p12' -o -name '*.p8' -o -name '*.mobileprovision' \) | grep -q .; then
            echo "Signing material must never be included in the repository."
            exit 1
          fi

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumapass
      POSTGRES_USER: lumapass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lumapass-postgres:/var/lib/postgresql/data
      - ./backend/sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumapass -d lumapass"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-lumapasslocal}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-local-object-store-secret-rotate}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - lumapass-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  object-store-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lumapasslocal}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-object-store-secret-rotate}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set demo http://object-store:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing demo/lumapass-assets
        mc anonymous set none demo/lumapass-assets
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LUMAPASS_ENV: demo
      DATABASE_URL: postgresql://lumapass:${POSTGRES_PASSWORD:-local-demo-only}@db:5432/lumapass
      S3_ENDPOINT_URL: http://object-store:9000
      S3_REGION: us-east-1
      S3_BUCKET: lumapass-assets
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-lumapasslocal}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-local-object-store-secret-rotate}
      APPLE_APP_ID: ${APPLE_APP_ID:-app.lumapass.ios}
      APPLE_AUTH_AUDIENCE: ${APPLE_APP_ID:-app.lumapass.ios}
      PASS_TYPE_IDENTIFIER: ""
      APPLE_TEAM_IDENTIFIER: ""
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      object-store-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 8
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  lumapass-postgres:
  lumapass-minio:
